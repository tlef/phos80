<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720">
  <!-- Original demo artwork: a retro travel poster for a jungle moon. -->
  <rect width="480" height="720" fill="#e8e2d2"/>
  <g>
    <!-- sky -->
    <rect x="28" y="28" width="424" height="560" fill="#7d95b5"/>
    <rect x="28" y="28" width="424" height="200" fill="#8aa2c0"/>
    <!-- gas giant -->
    <circle cx="330" cy="60" r="190" fill="#c26e45"/>
    <circle cx="330" cy="60" r="190" fill="none" stroke="#a85a38" stroke-width="6" opacity="0.5"/>
    <ellipse cx="270" cy="20" rx="70" ry="34" fill="#a85a38" opacity="0.55"/>
    <ellipse cx="400" cy="110" rx="90" ry="40" fill="#b06340" opacity="0.6"/>
    <ellipse cx="330" cy="180" rx="110" ry="30" fill="#9c5434" opacity="0.45"/>
    <!-- drifting freighter silhouette -->
    <g transform="translate(320 150) rotate(-14)" fill="#3a2c22">
      <ellipse cx="0" cy="0" rx="34" ry="12"/>
      <rect x="-8" y="-16" width="22" height="8" rx="3"/>
    </g>
    <!-- distant fighter -->
    <g transform="translate(180 350) rotate(-8)" fill="#4a5666">
      <rect x="-16" y="-2" width="32" height="4" rx="2"/>
      <rect x="-4" y="-10" width="6" height="20" rx="2"/>
    </g>
    <!-- mountains -->
    <path d="M28 470 L110 420 L190 470 Z" fill="#5c7091" opacity="0.8"/>
    <path d="M150 480 L260 415 L370 480 Z" fill="#54688a" opacity="0.7"/>
    <!-- pyramids -->
    <g fill="#8f8a76">
      <path d="M330 400 L452 470 L208 470 Z"/>
      <path d="M330 400 L452 470 L330 470 Z" fill="#7c7764"/>
      <path d="M180 440 L260 480 L100 480 Z"/>
      <path d="M180 440 L260 480 L180 480 Z" fill="#6e6a59"/>
    </g>
    <g fill="#a9a48e">
      <rect x="318" y="416" width="24" height="10"/>
      <rect x="306" y="432" width="48" height="10"/>
      <rect x="294" y="448" width="72" height="10"/>
    </g>
    <!-- jungle canopy -->
    <g fill="#7e9457">
      <ellipse cx="60" cy="500" rx="70" ry="34"/>
      <ellipse cx="150" cy="512" rx="80" ry="38"/>
      <ellipse cx="260" cy="500" rx="90" ry="36"/>
      <ellipse cx="370" cy="514" rx="85" ry="40"/>
      <ellipse cx="440" cy="500" rx="60" ry="32"/>
    </g>
    <g fill="#8ca465">
      <ellipse cx="100" cy="530" rx="80" ry="34"/>
      <ellipse cx="220" cy="540" rx="95" ry="38"/>
      <ellipse cx="350" cy="532" rx="90" ry="36"/>
      <ellipse cx="440" cy="544" rx="60" ry="30"/>
    </g>
    <g fill="#9db370">
      <ellipse cx="60" cy="560" rx="75" ry="32"/>
      <ellipse cx="180" cy="568" rx="85" ry="34"/>
      <ellipse cx="300" cy="560" rx="88" ry="34"/>
      <ellipse cx="410" cy="570" rx="80" ry="34"/>
    </g>
    <!-- clearing -->
    <path d="M120 588 Q240 560 452 588 L452 588 L28 588 Z" fill="#cfd8b8"/>
    <!-- watchtower + sentinel -->
    <g fill="#2e2419">
      <rect x="66" y="470" width="34" height="118"/>
      <path d="M66 470 L100 470 L108 452 L58 452 Z"/>
      <rect x="79" y="404" width="8" height="52"/>
      <path d="M83 376 L92 404 L74 404 Z"/>
      <circle cx="72" cy="436" r="12"/>
      <path d="M60 444 Q72 428 90 446 L90 456 L60 456 Z"/>
    </g>
  </g>
  <!-- title -->
  <text x="240" y="672" text-anchor="middle" fill="#4d5f7d"
        font-family="Futura, 'Trebuchet MS', sans-serif" font-size="86"
        font-weight="700" letter-spacing="10">YAVIN 4</text>
  <rect x="28" y="28" width="424" height="560" fill="none" stroke="#e8e2d2" stroke-width="0"/>
</svg>
